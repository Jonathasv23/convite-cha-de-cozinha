<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel da Noiva | Gestão do Chá de Cozinha</title>

  <!-- Google Fonts: EB Garamond & Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Folhas de Estilo -->
  <link rel="stylesheet" href="assets/css/admin.css">
  <link rel="stylesheet" href="assets/css/print.css" media="print">
</head>
<body>
  <!-- Gate de Acesso por PIN Mestre (Será implementado na Fase 5) -->
  <div id="pin-gate-overlay" class="admin-pin-overlay">
    <div class="pin-gate-card">
      <h1 class="pin-gate-title">Área Restrita da Noiva</h1>
      <p class="pin-gate-subtitle">Insira o PIN Mestre para acessar a gestão do evento.</p>
      <div class="pin-gate-form">
        <input type="password" id="pin-input" class="pin-input" maxlength="8" placeholder="Digite o PIN" autocomplete="off" disabled>
        <button type="button" id="btn-entrar-pin" class="btn-primary" disabled>Acessar Painel</button>
      </div>
      <p class="pin-status-message">Infraestrutura inicial pronta. Controle administrativo ativo a partir da Fase 5.</p>
    </div>
  </div>

  <!-- Painel Administrativo Principal (Oculto até validação de PIN) -->
  <div id="admin-app" class="admin-container" style="display: none;">
    <header class="admin-header">
      <h2 class="admin-title">Gestão do Chá de Cozinha</h2>
      <div class="admin-header-actions no-print">
        <button id="btn-logout" class="btn-secondary">Sair / Bloquear</button>
      </div>
    </header>

    <main class="admin-main">
      <div id="dashboard-metrics" class="dashboard-metrics"></div>
      <div id="guest-table-container" class="guest-table-container"></div>
    </main>
  </div>

  <!-- Container de Notificações Toast -->
  <div id="admin-toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Script Principal de Configuração -->
  <script type="module" src="config/config.js"></script>
</body>
</html>
