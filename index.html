<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Convite Oficial e Lista de Presentes para o Chá de Cozinha de Hevelyn &amp; Jonathas. Confirme sua presença e celebre conosco!">
  <meta name="theme-color" content="#3D4A36">
  <title>Chá de Cozinha - Hevelyn &amp; Jonathas | Convite Oficial</title>

  <!-- Google Fonts: EB Garamond (Display/Headlines) & Manrope (UI/Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Folha de Estilos Oficial (Botanical Heritage Atelier) -->
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <div id="app" class="app-container">
    <!-- Bloco 1: Hero Card com Monograma, Boas-Vindas e Logística -->
    <header id="hero-section" class="hero-section" aria-label="Apresentação do Evento">
      <div class="hero-card paper-texture">
        <div class="hero-card__inner-border">
          <span class="eyebrow-tag">CHÁ DE COZINHA</span>
          <h1 class="couple-title">Hevelyn &amp; Jonathas</h1>
          <p class="hero-message">Carregando convite especial...</p>
        </div>
      </div>
    </header>

    <!-- Bloco 2: Contagem Regressiva Viva (Countdown Timer) -->
    <div id="countdown-section-wrapper" class="countdown-wrapper" aria-label="Tempo restante"></div>

    <!-- Bloco 3: Vitrine da Paleta de Cores Sugerida -->
    <div id="palette-section-wrapper" class="palette-wrapper" aria-label="Paleta de Cores"></div>

    <!-- Bloco 4: Conteúdo Principal e Formulário Integrado de RSVP -->
    <main id="main-content" class="main-content">
      <section id="rsvp-section" class="rsvp-section" aria-label="Confirmação de Presença">
        <div class="rsvp-card-wrapper paper-texture">
          <div class="rsvp-card__inner-border">
            <p class="placeholder-text" style="text-align: center; color: var(--color-text-muted);">
              Carregando lista de presentes e confirmação...
            </p>
          </div>
        </div>
      </section>
    </main>

    <!-- Rodapé Institucional -->
    <footer id="footer-section" class="footer-section">
      <p class="footer-credit">Chá de Cozinha de Hevelyn &amp; Jonathas &bull; Botanical Heritage Atelier</p>
    </footer>
  </div>

  <!-- Container Global de Notificações Toast -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Controlador Modular ES6 (Padrão MVC para Servidores Estáticos e GitHub Pages) -->
  <script type="module">
    try {
      const { ConviteController } = await import('./app/controllers/ConviteController.js');
      window.__conviteIniciado = true;
      const controller = new ConviteController();
      controller.iniciar();
    } catch (e) {
      console.warn('Módulo ES6 não suportado diretamente neste protocolo. Utilizando carregamento autossuficiente.');
    }
  </script>

  <!-- Script Autossuficiente de Compatibilidade (Garante funcionamento perfeito mesmo em duplo clique file:///) -->
  <script src="assets/js/app.bundle.js" defer></script>
</body>
</html>
