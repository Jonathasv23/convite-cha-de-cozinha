<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Convite Digital e Lista de Presentes para o Chá de Cozinha de Helena & Gabriel. Confirme sua presença e escolha seu presente.">
  <title>Chá de Cozinha - Helena & Gabriel | Convite Oficial</title>

  <!-- Google Fonts: EB Garamond & Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Estilos da Aplicação -->
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <div id="app" class="app-container">
    <!-- Estrutura base da visão pública do convite (Será preenchida na Fase 4) -->
    <header id="hero-section" class="hero-section" aria-label="Apresentação do Evento">
      <div class="hero-card">
        <span class="eyebrow-tag">Chá de Cozinha</span>
        <h1 class="couple-title">Helena & Gabriel</h1>
        <p class="hero-message">Aguarde, estamos preparando todos os detalhes com muito carinho...</p>
      </div>
    </header>

    <main id="main-content" class="main-content">
      <!-- Seção de Contagem Regressiva, Logística, Paleta e Formulário RSVP -->
      <section id="rsvp-section" class="rsvp-section" aria-label="Confirmação de Presença">
        <p class="placeholder-text">Sistema em preparação (Fase 1 de Infraestrutura concluída).</p>
      </section>
    </main>

    <footer id="footer-section" class="footer-section">
      <p class="footer-credit">Botanical Heritage Atelier &bull; 2026</p>
    </footer>
  </div>

  <!-- Container de Notificações Toast -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Script Principal (Módulo ES6) -->
  <script type="module" src="config/config.js"></script>
</body>
</html>
